[package]
name = "flint-core"
version = "0.1.0"
edition = "2021"
description = "The part of flint without UI: SSH, SFTP, terminal emulator, vault and sync"
license = "GPL-3.0-only"
publish = false

[dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
russh = "0.45"
russh-sftp = "2"
alacritty_terminal = "0.26"
tokio = { version = "1", features = ["rt", "macros", "fs", "io-util", "net", "sync", "time"] }
tokio-socks = "0.5"
base64 = "0.22"
async-channel = "2"
async-trait = "0.1"
futures = "0.3"

# vault
argon2 = "0.5"
chacha20poly1305 = "0.10"
secrecy = "0.8"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
ciborium = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
bip39 = { version = "2", features = ["zeroize"] }

# sync
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
subtle = "2"
hkdf = "0.12"
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = ["Win32_System_Memory", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
too_many_arguments = "allow"
large_enum_variant = "allow"
type_complexity = "allow"

# argon2 and russh are too slow to use unoptimized, even in tests.
[profile.dev.package."*"]
opt-level = 3
